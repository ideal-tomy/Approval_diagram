<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>実画面を見る</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body class="destination screen-viewer">
  <header class="topbar">
    <a class="brand" href="index.html"><b>受入検査 AIサポート</b></a>
    <a class="return-link" href="index.html">← トップへ戻る</a>
  </header>
  <main class="section-wrap destination-main">
    <div class="destination-heading"><div><p class="eyebrow">実画面</p><h1>実際の業務画面を見る</h1></div><a class="return-link" href="story-mode.html">ガイド体験へ戻る →</a></div>
    <div class="screen-tabs" role="tablist" aria-label="実画面">
      <button type="button" role="tab" id="tab-match" data-screen="match" aria-controls="screen-detail" aria-selected="true">照合</button>
      <button type="button" role="tab" id="tab-hold" data-screen="hold" aria-controls="screen-detail" aria-selected="false" tabindex="-1">保留一覧</button>
      <button type="button" role="tab" id="tab-approval" data-screen="approval" aria-controls="screen-detail" aria-selected="false" tabindex="-1">承認</button>
      <button type="button" role="tab" id="tab-standard" data-screen="standard" aria-controls="screen-detail" aria-selected="false" tabindex="-1">基準改定</button>
    </div>
    <section id="screen-detail" role="tabpanel" aria-labelledby="tab-match" tabindex="0">
      <div class="detail-head"><div><p class="eyebrow" id="detail-kicker">MATCH</p><h2 id="detail-title">図面と証明書を、同じ画面で照合する。</h2></div></div>
      <div class="detail-shell" id="detail-content"></div>
      <a class="return-link source-screen" id="source-screen" href="images/01.png" target="_blank" rel="noopener">元の実画面を開く ↗</a>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
